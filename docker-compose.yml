services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamenest
      POSTGRES_PASSWORD: gamenest
      POSTGRES_DB: gamenest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamenest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
